name: Validate Asset Preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate original orc model geometry
        run: node tools/validate-orc.mjs
      - name: Check JavaScript syntax
        run: |
          node --check tools/generate-orc.mjs
          node --check tools/validate-orc.mjs
          node --check preview/app.js
          node --check preview/world.js
          node --check tools/smoke-preview.mjs
      - name: Verify generated 3D model is reproducible
        run: |
          mkdir -p /tmp/orcbands-assets
          node tools/generate-orc.mjs /tmp/orcbands-assets
          cmp preview/assets/orc-worker.obj /tmp/orcbands-assets/orc-worker.obj
          cmp preview/assets/orc-worker.mtl /tmp/orcbands-assets/orc-worker.mtl
      - name: Browser smoke test (real WebGL)
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/smoke-preview.mjs
      - name: Upload rendered preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-webgl-smoke-screenshots
          path: smoke-artifacts/*.png
          if-no-files-found: ignore
