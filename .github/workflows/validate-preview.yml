name: Validate Forest Asset Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep the latest iteration's expensive WebGL captures, not superseded PR runs.
concurrency:
  group: orcbands-forest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check tools/generate-tree.mjs
          node --check tools/generate-hut.mjs
          node --check tools/validate-hut.mjs
          node --check preview/resource-geometry.js
          node --check preview/settlement-resources.js
          node --check tools/validate-settlement.mjs
          node --check preview/storage-resources.js
          node --check tools/validate-stockpiles.mjs
          node --check preview/resources.js
          node --check preview/resource-viewer.js
          node --check tools/validate-resources.mjs
          node --check preview/camp-ui.js
          node --check preview/camp-ui-model.js
          node --check tools/validate-camp-ui.mjs
          node --check tools/smoke-camp-ui.mjs
          node --check preview/app.js
          node --check preview/torches.js
          node --check preview/camp-visibility.js
          node --check tools/validate-camp-visibility.mjs
          node --check preview/fire-motion.js
          node --check preview/fire-atmosphere.js
          node --check tools/validate-fire-atmosphere.mjs
          node --check preview/campfire.js
          node --check tools/validate-campfire.mjs
          node --check preview/forest-story.js
          node --check preview/environment.js
          node --check preview/environment-layout.js
          node --check preview/ground-surface.js
          node --check tools/validate-environment.mjs
          node --check tools/smoke-preview.mjs
      - name: Verify deterministic tree export and actual geometry
        run: |
          mkdir -p /tmp/orcbands-tree
          node tools/generate-tree.mjs /tmp/orcbands-tree
          cmp preview/assets/low-poly-pine-01.obj /tmp/orcbands-tree/low-poly-pine-01.obj
          cmp preview/assets/low-poly-pine-01.mtl /tmp/orcbands-tree/low-poly-pine-01.mtl
          node -e "const fs=require('fs');const s=fs.readFileSync('preview/assets/low-poly-pine-01.obj','utf8');if((s.match(/^v /gm)||[]).length!==109||(s.match(/^f /gm)||[]).length!==144)throw Error('Unexpected mesh geometry')"
      - name: Verify deterministic hut export
        run: |
          node tools/generate-hut.mjs /tmp/orcbands-hut
          cmp preview/assets/timber-hut-01.obj /tmp/orcbands-hut/timber-hut-01.obj
          cmp preview/assets/timber-hut-01.mtl /tmp/orcbands-hut/timber-hut-01.mtl
      - name: Run real WebGL browser smoke test
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 three@0.166.1
          npx playwright install --with-deps chromium
          node tools/validate-camp-ui.mjs
          node tools/validate-settlement.mjs
          node tools/validate-stockpiles.mjs
          node tools/validate-resources.mjs
          node tools/validate-environment.mjs
          node tools/validate-hut.mjs
          node tools/validate-campfire.mjs
          node tools/validate-camp-visibility.mjs
          node tools/validate-fire-atmosphere.mjs
          ORCBANDS_LOCAL_THREE=1 ORCBANDS_ESSENTIAL_CAPTURE=1 node tools/smoke-preview.mjs
      - name: Attach browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-forest-webgl-smoke
          path: smoke-artifacts/
          if-no-files-found: ignore

  camp-ui:
    # Independent runner: HUD interaction checks no longer extend the long
    # forest/art-preview critical path. These are real WebGL browser tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run real camp HUD desktop and mobile smoke
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 three@0.166.1
          npx playwright install --with-deps chromium
          ORCBANDS_LOCAL_THREE=1 ORCBANDS_ESSENTIAL_CAPTURE=1 node tools/smoke-camp-ui.mjs
      - name: Attach camp interaction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-camp-ui-smoke
          path: smoke-artifacts/camp-ui/
          if-no-files-found: ignore
