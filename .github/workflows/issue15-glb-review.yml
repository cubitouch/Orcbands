name: Worker Orc #15 — exported GLB visual evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "art/**"
      - "tools/check-issue15-references.py"
      - ".github/workflows/issue15-glb-review.yml"

permissions:
  contents: read

jobs:
  actual-glb-visual-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify reference manifest (exact originals required for candidate acceptance)
        run: |
          python3 tools/check-issue15-references.py
          if [ -f art/candidate/worker-orc-candidate.glb ]; then
            python3 tools/check-issue15-references.py --require-all
            test -s art/candidate/worker-orc-candidate.blend
          fi
      - name: Install headless Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -n 2
      - name: Export current baseline (do not use .blend screenshots as comparison)
        run: |
          mkdir -p /tmp/worker-orc-baseline
          blender -b -t 2 --python-exit-code 1 --python art/worker_orc_vnext.py -- \
            --output /tmp/worker-orc-baseline --export-only
      - name: Render actual exported GLB baseline and optional candidate
        run: |
          mkdir -p issue15-review
          args=(
            --baseline /tmp/worker-orc-baseline/worker-orc-vnext.glb
            --output issue15-review
          )
          if [ -f art/candidate/worker-orc-candidate.glb ]; then
            args+=(--candidate art/candidate/worker-orc-candidate.glb)
          fi
          blender -b -t 2 --python-exit-code 1 --python art/render_issue15_glb.py -- "${args[@]}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("issue15-review")
          report = json.loads((root / "summary.json").read_text())
          assert report["baseline"]["triangles"] > 100
          for name in ("01-front","02-left","03-back","04-right","05-three-quarter","06-face-close","07-hands-and-gear","08-rts-five"):
              assert (root/"baseline"/(name+".png")).stat().st_size > 10000, name
          print("Exported GLB evidence:", report["baseline"])
          PY
      - name: Chromium/WebGL exported baseline proof (not a substitute for art review)
        run: |
          cp /tmp/worker-orc-baseline/worker-orc-vnext.glb preview/assets/worker-orc-vnext.glb
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          ORCBANDS_TEST_BLENDER=1 node tools/smoke-preview.mjs
          cp smoke-artifacts/character-blender.png issue15-review/09-actual-chromium-webgl.png
      - name: Upload full-resolution review captures and metrics, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue15-exported-glb-review
          path: issue15-review/
          if-no-files-found: warn
