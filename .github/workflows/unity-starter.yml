name: Unity Starter Builds

on:
  pull_request:
    paths:
      - "unity/**"
      - "tools/validate-unity-starter.mjs"
      - "tools/generate-unity-environment.mjs"
      - "tools/generate-unity-tree-shadows.mjs"
      - "preview/environment-layout.js"
      - "preview/environment.js"
      - "preview/forest-story.js"
      - "tools/validate-forest-story.mjs"
      - "preview/ground-surface.js"
      - "preview/resources.js"
      - "preview/resource-geometry.js"
      - "preview/storage-resources.js"
      - "preview/settlement-resources.js"
      - "tools/smoke-unity-webgl.mjs"
      - "tools/capture-unity-characters.mjs"
      - ".github/workflows/unity-starter.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: Player build to produce
        type: choice
        required: true
        default: WebGL
        options:
          - WebGL
          - StandaloneOSX

permissions:
  contents: read

# A later push makes an older PR screenshot/build obsolete. Retain explicit
# workflow_dispatch runs, and never cancel unrelated PRs.
concurrency:
  group: orcbands-unity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify unchanged exported meshes and Unity bootstrap files
        run: node tools/validate-unity-starter.mjs
      - name: Export approved forest layout and 3D props
        run: |
          npm install --no-save --ignore-scripts three@0.166.1
          node tools/generate-unity-environment.mjs
      - name: Check exported approved Unity content
        run: |
          node tools/validate-unity-environment.mjs
          node tools/validate-forest-story.mjs

  license-check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check presence of Unity CI secrets (never print values)
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$UNITY_LICENSE" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity player build skipped: repository Unity CI secrets are incomplete."
          fi

  webgl:
    needs: [validate-bridge, license-check]
    if: needs.license-check.outputs.ready == 'true' && (github.event_name == 'pull_request' || inputs.platform == 'WebGL')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Export approved forest layout and 3D props
        run: |
          npm install --no-save --ignore-scripts three@0.166.1
          node tools/generate-unity-environment.mjs
      - name: Restore Unity WebGL Library cache
        id: unity-library-cache
        uses: actions/cache/restore@v4
        with:
          path: unity/Library
          key: Library-Orcbands-${{ runner.os }}-WebGL-6000.3.24f1-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**', 'preview/**', 'tools/generate-unity-*.mjs') }}
          restore-keys: |
            Library-Orcbands-${{ runner.os }}-WebGL-6000.3.24f1-
      - name: Build Orcbands for browser
        id: player-build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: WebGL
          buildMethod: Orcbands.Editor.OrcbandsSceneSetup.Build
          versioning: None
      - name: Save Unity WebGL Library cache
        if: steps.unity-library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 4
        continue-on-error: true
        with:
          path: unity/Library
          key: ${{ steps.unity-library-cache.outputs.cache-primary-key }}
      - name: Install headless Chromium smoke dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify WebGL actually boots in Chromium
        run: node tools/smoke-unity-webgl.mjs
      - name: Capture character art review in actual Unity WebGL
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/WebGL/Orcbands &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/capture-unity-characters.mjs
      - name: Upload WebGL smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-browser-smoke
          path: smoke-artifacts/unity-webgl/
          if-no-files-found: ignore
      - name: Upload WebGL player
        if: always() && steps.player-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-webgl
          path: build/WebGL/Orcbands/
          if-no-files-found: error

  macos:
    needs: [validate-bridge, license-check]
    if: needs.license-check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.platform == 'StandaloneOSX'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Export approved forest layout and 3D props
        run: |
          npm install --no-save --ignore-scripts three@0.166.1
          node tools/generate-unity-environment.mjs
      - name: Build Orcbands for macOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: StandaloneOSX
          buildMethod: Orcbands.Editor.OrcbandsSceneSetup.Build
          versioning: None
      - name: Upload macOS player
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-macos
          path: build/StandaloneOSX/Orcbands.app/
          if-no-files-found: error
