name: Unity Starter Builds

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      platform:
        description: Player build to produce
        type: choice
        required: true
        default: WebGL
        options:
          - WebGL
          - StandaloneOSX
      gameplay_review:
        description: Run the band and resource browser playthrough
        type: boolean
        default: false
      full_review:
        description: Run exhaustive WebGL regression and art captures
        type: boolean
        default: false

permissions:
  contents: read

# A later push makes an older PR screenshot/build obsolete. Retain explicit
# workflow_dispatch runs, and never cancel unrelated PRs.
concurrency:
  group: orcbands-unity-${{ (github.event.label.name && github.event.label.name != 'unity-visual-review' && github.event.label.name != 'unity-full-review' && github.event.label.name != 'unity-gameplay-review') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'unity-visual-review' || github.event.label.name == 'unity-full-review' || github.event.label.name == 'unity-gameplay-review'
    runs-on: ubuntu-latest
    outputs:
      player: ${{ steps.paths.outputs.player }}
      bridge: ${{ steps.paths.outputs.bridge }}
      browser: ${{ steps.paths.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CI routing and cache security
        run: |
          node tools/test-ci-changes.mjs
          node tools/test-unity-ci-cache.mjs
          node tools/test-find-unity-player.mjs
      - name: Detect changed build inputs
        id: paths
        run: node tools/ci-changes.mjs

  validate-bridge:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify unchanged exported meshes and Unity bootstrap files
        run: node tools/validate-unity-starter.mjs
      - name: Export approved forest layout and 3D props
        run: |
          npm install --no-save --ignore-scripts three@0.166.1
          node tools/generate-unity-environment.mjs
      - name: Check exported approved Unity content
        run: |
          node tools/validate-unity-environment.mjs
          node tools/validate-forest-story.mjs

  browser-host:
    needs: changes
    if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.player != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check save storage and menu host without a Unity build
        run: |
          node tools/test-save-store.mjs
          node tools/test-menu-host.mjs

  license-check:
    needs: changes
    if: needs.changes.outputs.player == 'true'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check presence of Unity CI secrets (never print values)
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$UNITY_LICENSE" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity player build skipped: repository Unity CI secrets are incomplete."
          fi

  webgl:
    needs: [changes, validate-bridge, license-check]
    # Prefer one licensed build for an opted-in, same-repository PR. Forks
    # retain the public proxy path; full review deliberately runs both builds.
    if: >-
      needs.license-check.outputs.ready == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.platform == 'WebGL') ||
       (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' &&
        (contains(github.event.pull_request.labels.*.name, 'unity-full-review') ||
         !(github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'main' &&
           (contains(github.event.pull_request.labels.*.name, 'unity-visual-review') ||
            contains(github.event.pull_request.labels.*.name, 'unity-gameplay-review'))))))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (contains(github.event.pull_request.labels.*.name, 'unity-full-review') || inputs.full_review) && 90 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out private character pack
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: cubitouch/Orcbands-PrivateAssets
          ref: main
          token: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
          path: .licensed-source
          persist-credentials: false
      - name: Restore private character pack
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          test -f .licensed-source/Synty/PolygonMiniFantasyCharacters/Prefabs/Characters/SM_Chr_Dungeon_GoblinMale_01.prefab
          test ! -e unity/Assets/Synty
          cp -a .licensed-source/Synty unity/Assets/Synty
          test -f .licensed-source/Mixamo/Worker/Idle.fbx
          cp -a .licensed-source/Mixamo unity/Assets/Mixamo
          rm -rf .licensed-source
      - name: Export approved forest layout and 3D props
        run: |
          npm install --no-save --ignore-scripts three@0.166.1
          node tools/generate-unity-environment.mjs
      - name: Restore Unity Library cache
        id: library-cache
        uses: ./.github/actions/unity-cache
        with:
          mode: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'licensed' || 'public' }}
          platform: WebGL
          secret: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.PRIVATE_ASSETS_TOKEN || '' }}
      - name: Build Orcbands for browser
        id: player-build
        uses: game-ci/unity-builder@v4
        env:
          ORCBANDS_REQUIRE_PRIVATE_ASSETS: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && '1' || '0' }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: WebGL
          buildMethod: Orcbands.Editor.OrcbandsSceneSetup.Build
          versioning: None
      - name: Save Unity Library cache
        if: steps.library-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/unity-cache
        with:
          operation: save
          mode: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'licensed' || 'public' }}
          platform: WebGL
          secret: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.PRIVATE_ASSETS_TOKEN || '' }}
          key: ${{ steps.library-cache.outputs.key }}
      - name: Install headless Chromium smoke dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check save storage and menu host
        run: |
          node tools/test-save-store.mjs
          node tools/test-menu-host.mjs
      - name: Verify WebGL actually boots in Chromium
        env:
          ORCBANDS_SMOKE_QUICK: ${{ (contains(github.event.pull_request.labels.*.name, 'unity-full-review') || inputs.full_review) && '0' || '1' }}
        run: node tools/smoke-unity-webgl.mjs
      - name: Focused band and resource playthrough (opt-in)
        if: >-
          (contains(github.event.pull_request.labels.*.name, 'unity-gameplay-review') || inputs.gameplay_review) &&
          !(contains(github.event.pull_request.labels.*.name, 'unity-full-review') || inputs.full_review)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/WebGL/Orcbands &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/capture-band-mining.mjs
      - name: Full Unity regression and art review (opt-in)
        if: >-
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'unity-full-review')) ||
          (github.event_name == 'workflow_dispatch' && inputs.full_review)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/WebGL/Orcbands &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/test-background-music.mjs
          node tools/capture-menu-persistence.mjs
          node tools/capture-band-mining.mjs
          node tools/capture-finite-trees.mjs
          node tools/capture-tree-chop-feedback.mjs
          node tools/capture-worker-navigation.mjs
          node tools/capture-rts-controls.mjs
          node tools/capture-unity-characters.mjs
      - name: Upload WebGL smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-browser-smoke
          path: smoke-artifacts/unity-webgl/
          if-no-files-found: ignore
      - name: Upload WebGL player
        if: always() && steps.player-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-webgl
          path: build/WebGL/Orcbands/
          if-no-files-found: error

  macos:
    needs: [changes, validate-bridge, license-check]
    if: needs.license-check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.platform == 'StandaloneOSX'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check out private character pack
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: cubitouch/Orcbands-PrivateAssets
          ref: main
          token: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
          path: .licensed-source
          persist-credentials: false
      - name: Restore private character pack
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          test -f .licensed-source/Synty/PolygonMiniFantasyCharacters/Prefabs/Characters/SM_Chr_Dungeon_GoblinMale_01.prefab
          test ! -e unity/Assets/Synty
          cp -a .licensed-source/Synty unity/Assets/Synty
          test -f .licensed-source/Mixamo/Worker/Idle.fbx
          cp -a .licensed-source/Mixamo unity/Assets/Mixamo
          rm -rf .licensed-source
      - name: Export approved forest layout and 3D props
        run: |
          npm install --no-save --ignore-scripts three@0.166.1
          node tools/generate-unity-environment.mjs
      - name: Restore Unity Library cache
        id: library-cache
        uses: ./.github/actions/unity-cache
        with:
          mode: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'licensed' || 'public' }}
          platform: StandaloneOSX
          secret: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.PRIVATE_ASSETS_TOKEN || '' }}
      - name: Build Orcbands for macOS
        id: player-build
        uses: game-ci/unity-builder@v4
        env:
          ORCBANDS_REQUIRE_PRIVATE_ASSETS: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && '1' || '0' }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: StandaloneOSX
          buildMethod: Orcbands.Editor.OrcbandsSceneSetup.Build
          versioning: None
      - name: Save Unity Library cache
        if: steps.library-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/unity-cache
        with:
          operation: save
          mode: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'licensed' || 'public' }}
          platform: StandaloneOSX
          secret: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.PRIVATE_ASSETS_TOKEN || '' }}
          key: ${{ steps.library-cache.outputs.key }}
      - name: Upload macOS player
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-macos
          path: build/StandaloneOSX/Orcbands.app/
          if-no-files-found: error

