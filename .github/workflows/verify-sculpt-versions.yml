name: Verify all Worker Orc versions
on:
  pull_request:
    paths:
      - "preview/**"
      - "tools/build-sculpt-versions.py"
      - "tools/smoke-preview.mjs"
      - ".github/workflows/verify-sculpt-versions.yml"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  versions-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install original Blender sculpt toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Rebuild all three distinct sculpt milestones
        run: python3 tools/build-sculpt-versions.py --output preview/assets
      - name: Validate original Git revisions, GLB payloads and hashes
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          folder=Path('preview/assets')
          v=json.loads((folder/'sculpt-versions.json').read_text())
          assert set(v)=={'sculpt-v1','sculpt-v2','sculpt'},set(v)
          assert v['sculpt-v1']['source_revision']=='e1897aad03dde8f5f1ef95054ba86b7b8d8c5fe9'
          assert v['sculpt-v2']['source_revision']=='89dabbb28b2deab966e00ef75a013707a016d231'
          assert len({t['sha256'] for t in v.values()})==3
          for stage,meta in v.items():
              data=(folder/meta['filename']).read_bytes()
              assert data[:4]==b'glTF' and len(data)>100_000
              assert hashlib.sha256(data).hexdigest()==meta['sha256']
              print(stage,meta['bytes'],'bytes',meta['sha256'])
          PY
      - name: Test all model switches and deep links in real WebGL
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          ORCBANDS_TEST_SCULPT_STAGES=1 node tools/smoke-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-version-assetlab-review
          path: |
            smoke-artifacts/
            preview/assets/sculpt-versions.json
          if-no-files-found: warn
