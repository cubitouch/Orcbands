name: Deploy Orcbands Asset Lab

on:
  push:
    branches: [main]
    paths:
      - "preview/**"
      - "art/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender for export
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Export latest original Worker Orc GLB
        run: |
          mkdir -p /tmp/orcbands-export
          blender -b -t 2 --python-exit-code 1 --python art/worker_orc_vnext.py -- --output /tmp/orcbands-export --export-only
          cp /tmp/orcbands-export/worker-orc-vnext.glb preview/assets/worker-orc-vnext.glb
          test -s preview/assets/worker-orc-vnext.glb
          blender -b -t 2 --python-exit-code 1 --python art/rig_worker_orc.py -- --input /tmp/orcbands-export/worker-orc-vnext.blend --output /tmp/orcbands-export --export-only
          cp /tmp/orcbands-export/worker-orc-skinned-experiment.glb preview/assets/worker-orc-skinned-experiment.glb
          test -s preview/assets/worker-orc-skinned-experiment.glb
      - name: Export historical #16/#17 and current sculpt stage
        run: |
          python3 tools/build-sculpt-versions.py --output preview/assets
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('preview/assets/sculpt-versions.json').read_text())
          assert set(data)=={'sculpt-v1','sculpt-v2','sculpt'}
          assert len({v['sha256'] for v in data.values()})==3, 'Different versions must export different GLBs'
          print('Distinct sculpt stage hashes:',[data[k]['sha256'] for k in data])
          PY
      - name: Stamp exact deployed source and generated GLB hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path('preview')
          revision=os.environ['GITHUB_SHA']
          expected=['worker-orc-vnext.glb','worker-orc-skinned-experiment.glb','worker-orc-sculpt-v1.glb','worker-orc-sculpt-v2-head.glb','worker-orc-sculpt-study.glb']
          assets={}
          for name in expected:
              content=(root/'assets'/name).read_bytes()
              assert len(content)>100_000, f'GLB unexpectedly small: {name}'
              assets[name]={'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest()}
          index=root/'index.html'
          data=index.read_text()
          assert '__ORCBANDS_REVISION__' in data
          index.write_text(data.replace('__ORCBANDS_REVISION__',revision[:12]))
          (root/'asset-build.json').write_text(json.dumps({
              'source_commit':revision,'assets':assets,
              'viewer_default':'sculpt',
              'sculpt_stages':json.loads((root/'assets/sculpt-versions.json').read_text()),
              'quality':'experimental sculpt studies are static, unlike Rigged beta; not approved production models'
          },indent=2)+'\n')
          print('Pages source:',revision,'generated assets:',assets)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: preview
      - name: Deploy static asset viewer to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
