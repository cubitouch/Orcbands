name: Deploy Orcbands Asset Lab

on:
  push:
    branches: [main]
    paths:
      - "preview/**"
      - "art/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender for export
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Export latest original Worker Orc GLB
        run: |
          mkdir -p /tmp/orcbands-export
          blender -b -t 2 --python-exit-code 1 --python art/worker_orc_vnext.py -- --output /tmp/orcbands-export
          cp /tmp/orcbands-export/worker-orc-vnext.glb preview/assets/worker-orc-vnext.glb
          test -s preview/assets/worker-orc-vnext.glb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: preview
      - name: Deploy static asset viewer to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
