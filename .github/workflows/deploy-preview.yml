name: Deploy Orcbands Browser Previews

on:
  push:
    branches: [main]
    paths:
      - "preview/**"
      - "tools/generate-tree.mjs"
      - "tools/generate-hut.mjs"
      - "unity/**"
      - "tools/validate-unity-starter.mjs"
      - "tools/generate-unity-environment.mjs"
      - "tools/generate-unity-tree-shadows.mjs"
      - "tools/smoke-unity-webgl.mjs"
      - ".github/workflows/deploy-preview.yml"
      - ".github/actions/unity-cache/**"
      - "tools/*ci*.mjs"
      - "tools/find-unity-player.mjs"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decision.outputs.build }}
      previous_run: ${{ steps.previous.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed player inputs
        id: paths
        run: node tools/ci-changes.mjs
      - name: Find the last successful deployed Unity player
        if: github.event_name == 'push' && steps.paths.outputs.unity != 'true'
        id: previous
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/find-unity-player.mjs
      - name: Decide whether Unity needs rebuilding
        id: decision
        env:
          REBUILD: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.unity == 'true' || !steps.previous.outputs.run }}
        run: echo "build=$REBUILD" >> "$GITHUB_OUTPUT"

  unity-build:
    needs: changes
    # Licensed content may only be read on the trusted main branch.
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check out privately licensed Synty assets
        uses: actions/checkout@v4
        with:
          repository: cubitouch/Orcbands-PrivateAssets
          ref: main
          token: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
          path: .licensed-source
          persist-credentials: false
      - name: Restore licensed assets to ignored Unity path
        run: |
          test -f .licensed-source/Synty/PolygonMiniFantasyCharacters/Prefabs/Characters/SM_Chr_Dungeon_GoblinMale_01.prefab
          test -f .licensed-source/Synty/PolygonMiniFantasyCharacters/Models/Characters.fbx
          test ! -e unity/Assets/Synty
          cp -a .licensed-source/Synty unity/Assets/Synty
          test -f .licensed-source/Mixamo/Worker/Idle.fbx
          cp -a .licensed-source/Mixamo unity/Assets/Mixamo
          rm -rf .licensed-source
      - name: Export approved forest layout and 3D props
        run: |
          npm install --no-save --ignore-scripts three@0.166.1
          node tools/generate-unity-environment.mjs
      - name: Restore Unity Library cache
        id: library-cache
        uses: ./.github/actions/unity-cache
        with:
          mode: licensed
          platform: WebGL
          secret: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
      - name: Build Unity browser player
        id: player-build
        uses: game-ci/unity-builder@v4
        env:
          ORCBANDS_REQUIRE_PRIVATE_ASSETS: "1"
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: WebGL
          buildMethod: Orcbands.Editor.OrcbandsSceneSetup.Build
          versioning: None
      - name: Save Unity Library cache
        if: steps.library-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/unity-cache
        with:
          operation: save
          mode: licensed
          platform: WebGL
          secret: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
          key: ${{ steps.library-cache.outputs.key }}
      - name: Check static hosting asset format
        shell: bash
        run: |
          test -f build/WebGL/Orcbands/index.html
          if find build/WebGL/Orcbands/Build -name '*.gz' -o -name '*.br' | grep -q .; then
            echo "::error::Unity WebGL payload requires compression headers unsupported by GitHub Pages."
            exit 1
          fi
      - name: Smoke-test deployed Unity WebGL player
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/smoke-unity-webgl.mjs
      - name: Upload WebGL smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-deploy-smoke
          path: smoke-artifacts/unity-webgl/
          if-no-files-found: ignore
      - name: Store Unity browser build
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-published-build
          path: build/WebGL/Orcbands/
          if-no-files-found: error

  deploy:
    needs: [changes, unity-build]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (needs.unity-build.result == 'success' || needs.unity-build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild and check original static assets
        run: |
          mkdir -p /tmp/orcbands-tree
          node tools/generate-tree.mjs /tmp/orcbands-tree
          cmp preview/assets/low-poly-pine-01.obj /tmp/orcbands-tree/low-poly-pine-01.obj
          cmp preview/assets/low-poly-pine-01.mtl /tmp/orcbands-tree/low-poly-pine-01.mtl
          node tools/generate-hut.mjs /tmp/orcbands-tree
          cmp preview/assets/timber-hut-01.obj /tmp/orcbands-tree/timber-hut-01.obj
          cmp preview/assets/timber-hut-01.mtl /tmp/orcbands-tree/timber-hut-01.mtl
      - name: Stamp deployed revision and asset hashes
        env:
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          root=Path('preview')
          revision=os.environ['REVISION']
          html=root/'index.html'
          html.write_text(html.read_text().replace('__ORCBANDS_REVISION__',revision[:12]))
          for module in root.glob('*.js'):
              module.write_text(module.read_text().replace('__ORCBANDS_REVISION__',revision[:12]))
          assets={}
          for name in ('low-poly-pine-01.obj','low-poly-pine-01.mtl','timber-hut-01.obj','timber-hut-01.mtl'):
              data=(root/'assets'/name).read_bytes()
              assets[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (root/'asset-build.json').write_text(json.dumps({
              'source_commit':revision,'asset':'low-poly-pine-01','assets':assets,
              'viewer_default':'studio','quality':'static experimental environment asset'
          },indent=2)+'\n')
          print('Asset build:',assets)
          PY
      - name: Download successful Unity player
        uses: actions/download-artifact@v4
        with:
          name: orcbands-unity-published-build
          path: preview/unity
          run-id: ${{ needs.changes.outputs.previous_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain reused Unity player for subsequent browser-only deployments
        if: needs.changes.outputs.previous_run
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-published-build
          path: preview/unity/
          if-no-files-found: error
      - name: Verify both previews are present
        run: |
          test -f preview/index.html
          test -f preview/unity/index.html
          test -d preview/unity/Build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: preview
      - name: Deploy Asset Lab and Unity player to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

