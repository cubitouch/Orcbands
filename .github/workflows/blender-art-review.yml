name: Blender Worker Orc Art Review

on:
  pull_request:
    paths:
      - "art/worker_orc_vnext.py"
      - "tools/validate-painted-glb.py"
      - ".github/workflows/blender-art-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -n 2
      - name: Generate real 3D model and multi-angle renders
        run: |
          mkdir -p art-review
          blender -b -t 2 --python-exit-code 1 --python art/worker_orc_vnext.py -- --output art-review
      - name: Validate outputs and document no Humanoid rig yet
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          d=Path('art-review')
          info=json.loads((d/'model-info.json').read_text())
          assert info['asset_store_dependencies'] is False
          assert info['humanoid_validated'] is False
          assert info['skinned'] is False
          # Desktop first, small number of units; preserve room for more
          # topology when it improves the actual character silhouette.
          assert info['triangles'] < 150000, f"Unexpected runaway geometry: {info['triangles']} triangles"
          raw=(d/'worker-orc-vnext.glb').read_bytes()
          assert raw[:4]==b'glTF' and len(raw)>20
          chunk_length=struct.unpack_from('<I',raw,12)[0]
          gltf=json.loads(raw[20:20+chunk_length])
          painted=sum('COLOR_0' in p.get('attributes',{})
                      for mesh in gltf['meshes'] for p in mesh['primitives'])
          assert painted>=2, f'Painted skin surface colors missing from GLB: {painted}'
          print('Painted vertex-color primitives:',painted)
          for name in info['outputs']:
              path=d/name
              assert path.is_file() and path.stat().st_size>1024, name
              print(name,path.stat().st_size)
          PY
      - name: Check GLB pixel material albedo instead of only COLOR_0 presence
        run: python3 tools/validate-painted-glb.py art-review/worker-orc-vnext.glb
      - name: Browser smoke — Blender GLB in the real viewer
        run: |
          cp art-review/worker-orc-vnext.glb preview/assets/worker-orc-vnext.glb
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          ORCBANDS_TEST_BLENDER=1 node tools/smoke-preview.mjs
          cp smoke-artifacts/character-blender.png art-review/05-browser-preview.png
      - name: Upload original blend, GLB and 4 real renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-worker-orc-vnext-art-review
          path: art-review/
          if-no-files-found: warn
