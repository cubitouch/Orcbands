name: Licensed Unity PR Visual Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: licensed-unity-review-${{ (github.event.label.name && github.event.label.name != 'unity-visual-review' && github.event.label.name != 'unity-full-review' && github.event.label.name != 'unity-gameplay-review') && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'unity-visual-review' || github.event.label.name == 'unity-full-review' || github.event.label.name == 'unity-gameplay-review'
    runs-on: ubuntu-latest
    outputs:
      player: ${{ steps.paths.outputs.player }}
      bridge: ${{ steps.paths.outputs.bridge }}
      browser: ${{ steps.paths.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CI routing and cache security
        run: |
          node tools/test-ci-changes.mjs
          node tools/test-unity-ci-cache.mjs
          node tools/test-find-unity-player.mjs
      - name: Detect changed build inputs
        id: paths
        run: node tools/ci-changes.mjs

  unity-build:
    needs: changes
    # Maintainer opt-in only. Fork PRs never receive private assets or secrets.
    # Do not use pull_request_target to execute a PR's build scripts.
    if: >-
      needs.changes.outputs.player == 'true' &&
      github.repository == 'cubitouch/Orcbands' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'unity-visual-review' || github.event.label.name == 'unity-full-review' || github.event.label.name == 'unity-gameplay-review') &&
      (contains(github.event.pull_request.labels.*.name, 'unity-visual-review') ||
       contains(github.event.pull_request.labels.*.name, 'unity-full-review') ||
       contains(github.event.pull_request.labels.*.name, 'unity-gameplay-review'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(github.event.pull_request.labels.*.name, 'unity-full-review') && 90 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out privately licensed Synty assets
        uses: actions/checkout@v4
        with:
          repository: cubitouch/Orcbands-PrivateAssets
          ref: main
          token: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
          path: .licensed-source
          persist-credentials: false
      - name: Restore licensed assets to ignored Unity path
        run: |
          test -f .licensed-source/Synty/PolygonMiniFantasyCharacters/Prefabs/Characters/SM_Chr_Dungeon_GoblinMale_01.prefab
          test -f .licensed-source/Synty/PolygonMiniFantasyCharacters/Models/Characters.fbx
          test ! -e unity/Assets/Synty
          cp -a .licensed-source/Synty unity/Assets/Synty
          test -f .licensed-source/Mixamo/Worker/Idle.fbx
          cp -a .licensed-source/Mixamo unity/Assets/Mixamo
          rm -rf .licensed-source
      - name: Export approved forest layout and 3D props
        run: |
          npm install --no-save --ignore-scripts three@0.166.1
          node tools/generate-unity-environment.mjs
      - name: Restore Unity Library cache
        id: library-cache
        uses: ./.github/actions/unity-cache
        with:
          mode: licensed
          platform: WebGL
          secret: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
      - name: Build Unity browser player
        id: player-build
        uses: game-ci/unity-builder@v4
        env:
          ORCBANDS_REQUIRE_PRIVATE_ASSETS: "1"
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: WebGL
          buildMethod: Orcbands.Editor.OrcbandsSceneSetup.Build
          versioning: None
      - name: Save Unity Library cache
        if: steps.library-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/unity-cache
        with:
          operation: save
          mode: licensed
          platform: WebGL
          secret: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
          key: ${{ steps.library-cache.outputs.key }}
      - name: Store Unity browser build
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-unity-published-build
          path: build/WebGL/Orcbands/
          if-no-files-found: error
      - name: Check static hosting asset format
        shell: bash
        run: |
          test -f build/WebGL/Orcbands/index.html
          if find build/WebGL/Orcbands/Build -name '*.gz' -o -name '*.br' | grep -q .; then
            echo "::error::Unity WebGL payload requires compression headers unsupported by GitHub Pages."
            exit 1
          fi
      - name: Install browser checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check save storage and menu host
        run: |
          node tools/test-save-store.mjs
          node tools/test-menu-host.mjs
      - name: Verify licensed WebGL boots
        env:
          ORCBANDS_SMOKE_QUICK: ${{ contains(github.event.pull_request.labels.*.name, 'unity-full-review') && '0' || '1' }}
        run: node tools/smoke-unity-webgl.mjs
      - name: Focused band and resource playthrough (opt-in)
        if: contains(github.event.pull_request.labels.*.name, 'unity-gameplay-review') || contains(github.event.pull_request.labels.*.name, 'unity-full-review')
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/WebGL/Orcbands &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/capture-band-mining.mjs
      - name: Full licensed regression and art review (opt-in)
        if: contains(github.event.pull_request.labels.*.name, 'unity-full-review')
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/WebGL/Orcbands &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/capture-menu-persistence.mjs
          node tools/capture-finite-trees.mjs
          node tools/capture-tree-chop-feedback.mjs
          node tools/capture-worker-navigation.mjs
          ORCBANDS_WORKER_REVIEW=1 node tools/capture-unity-characters.mjs
          node tools/capture-worker-animations.mjs
      - name: Upload licensed WebGL visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbands-licensed-character-review
          path: smoke-artifacts/unity-webgl/
          if-no-files-found: ignore

